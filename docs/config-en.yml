# ---------- v1.0: magic ----------
magic:
  # mana regen: mana per tick (tick = 2 s; lvl 20+ — 1 s)
  mana-per-tick: 5
  fast-regen-level: 20
  # damage matrix: spell-element × target-quirk (multiplied with the table below)
  elem-vs-quirk:
    fire:  { axe: 1.2, cat: 1.0, bedrock: 0.5, farmer: 1.0, sculk: 0.6, engineer: 1.0, amphibian: 1.2, spider: 1.3 }
    water: { axe: 0.9, cat: 0.8, bedrock: 0.7, farmer: 1.0, sculk: 1.0, engineer: 1.0, amphibian: 1.5, spider: 1.1 }
    wind:  { axe: 0.8, cat: 1.1, bedrock: 0.6, farmer: 1.0, sculk: 1.0, engineer: 1.0, amphibian: 1.0, spider: 0.9 }
    earth: { axe: 1.0, cat: 1.0, bedrock: 0.4, farmer: 1.2, sculk: 1.2, engineer: 1.2, amphibian: 0.9, spider: 1.1 }
    dark:  { axe: 1.0, cat: 1.2, bedrock: 0.6, farmer: 1.0, sculk: 0.5, engineer: 1.0, amphibian: 1.0, spider: 0.9 }
    light: { axe: 1.0, cat: 0.9, bedrock: 0.5, farmer: 1.0, sculk: 1.6, engineer: 1.0, amphibian: 1.0, spider: 1.3 }
  # damage matrix: caster-quirk × spell-element
  quirk-vs-elem:
    axe:       { fire: 1.3, water: 0.9, wind: 1.0, earth: 1.1, dark: 1.1, light: 0.8 }
    cat:       { fire: 1.0, water: 0.7, wind: 1.2, earth: 0.9, dark: 1.3, light: 1.0 }
    bedrock:   { fire: 0.8, water: 0.9, wind: 0.7, earth: 1.4, dark: 1.0, light: 1.1 }
    sculk:     { fire: 0.7, water: 0.8, wind: 0.9, earth: 1.1, dark: 1.5, light: 0.6 }
    farmer:    { fire: 0.9, water: 1.3, wind: 1.1, earth: 1.3, dark: 0.8, light: 1.1 }
    engineer:  { fire: 1.2, water: 1.0, wind: 1.1, earth: 1.1, dark: 0.9, light: 1.0 }
    amphibian: { fire: 0.6, water: 1.5, wind: 1.1, earth: 0.9, dark: 0.9, light: 1.0 }
    spider:    { fire: 1.1, water: 0.8, wind: 1.0, earth: 1.1, dark: 1.3, light: 0.8 }

# Cooldown scale (editable via /gaid → "Cooldown settings"):
# 1.0 = as intended, 0.5 = twice as fast, 2.0 = twice as slow.
cooldowns:
  spells-scale: 1.0
  potions-scale: 1.0
  items-scale: 1.0
