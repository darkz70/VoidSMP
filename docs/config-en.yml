  magic-bad-element: "&cUnknown element. Available: fire, water, wind, earth, dark, light."
  magic-book-given: "&aElement book &d%element% &agiven to &f%player%&a."
  magic-brew-given: "&aPotion &d%brew% &agiven to &f%player%&a."
  magic-bad-brew: "&cUnknown potion tag. See tab completion."
  magic-set-ok: "&aMagic of &f%player% &aupdated."
  magic-cast-fire3: "&cYour skin breathes heat — fire aura!"
  magic-cast-fire4: "&6Fire won't touch you (10 min)."
  magic-cast-fire5: "&6Fire pro: heat in your blood, doubled strikes!"
  magic-cast-fire6: "&4Seven blazes answer the call!"
  magic-cast-water3: "&bIce chills around you."
  magic-cast-water4: "&bWater is now your home (10 min)."
  magic-cast-water6: "&dThe depths share their strength."
  magic-cast-wind3: "&fThe wind lifts your steps."
  magic-cast-wind4: "&fFalling isn't scary anymore (5 min)."
  magic-cast-wind5: "&fThe storm pins enemies in place…"
  magic-cast-wind6: "&fThe enslaved storm carries you skyward!"
  magic-cast-earth1: "&7Stone fist charged — the next strike will smash."
  magic-cast-earth3: "&7A stone aura surrounds you."
  magic-cast-earth4: "&7Firm as bedrock itself (5 min)."
  magic-cast-earth6: "&8The earth rises into a wall!"
  magic-cast-dark2: "&5Your hands touch the shadows."
  magic-cast-dark3: "&5Darkness hides you from prying eyes (10 min)."
