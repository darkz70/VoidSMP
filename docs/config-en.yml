# ============================================================
#  VoidQuirks — quirks of shattered souls (VoidSMP)
#  All messages support &-colors and %prefix%.
#  Hunger "drumsticks" are counted in ICONS:
#  1 icon = 2 food level points. 3.5 icons = 7 points.
# ============================================================

language: en                  # en | ru
prefix: "&8[&5VoidSMP&8] &f"

scan:
  # anti-spam for all shift-trigger checks
  cooldown-ms: 2000
  engineer:
    radius-1: 5
    radius-2: 10
    radius-3: 15
    tnt-radius: 25
  cat:
  phantom-fear-radius: 24
    water-radius: 5

materials:
  # Engineer: what counts as "redstone"
  engineer-base: [REDSTONE_WIRE, REDSTONE_BLOCK, PISTON, STICKY_PISTON]
  engineer-extra: [TRIPWIRE]
  engineer-include-signs: true
  engineer-tnt-blocks: [TNT]
  # Meat (debuffs: Engineer lvl 2-3, Axe lvl 2-3, Spider)
  meat: [BEEF, COOKED_BEEF, PORKCHOP, COOKED_PORKCHOP, CHICKEN, COOKED_CHICKEN, MUTTON, COOKED_MUTTON, RABBIT, COOKED_RABBIT, ROTTEN_FLESH, RABBIT_STEW]
  # Fish (Cat buff)
  fish: [COD, COOKED_COD, SALMON, COOKED_SALMON, TROPICAL_FISH, PUFFERFISH]
  # Swords that crumble into a stick in Axe's inventory
  axe-low-swords-1: [WOODEN_SWORD, GOLDEN_SWORD, STONE_SWORD, IRON_SWORD, DIAMOND_SWORD]
  axe-low-swords-2: [WOODEN_SWORD, GOLDEN_SWORD, STONE_SWORD, IRON_SWORD]
  # What Sculk may eat (regular food) per level (raw fish allowed!)
  sculk-food-1: [BEEF, PORKCHOP, CHICKEN, MUTTON, RABBIT, ROTTEN_FLESH, COD, SALMON, TROPICAL_FISH, PUFFERFISH]
  sculk-food-2: [BEEF, PORKCHOP, CHICKEN, MUTTON, RABBIT, ROTTEN_FLESH, COD, SALMON, TROPICAL_FISH, PUFFERFISH]
  sculk-food-3: [BEEF, PORKCHOP, CHICKEN, MUTTON, RABBIT, ROTTEN_FLESH, COD, SALMON, TROPICAL_FISH, PUFFERFISH]
  # (legacy list, farmer raw-food debuff removed)
  farmer-raw-denied: [BEEF, PORKCHOP, CHICKEN, MUTTON, RABBIT, COD, SALMON, POTATO, KELP]

# Sculk: unusual "food" via right click (bones, gunpowder, slime).
# food — hunger points (2 = 1 icon), saturation — saturation points.
sculk-custom-food:
  2:
    BONE: { food: 2, saturation: 1 }
  3:
    BONE: { food: 2, saturation: 1 }
    GUNPOWDER: { food: 2, saturation: 0 }
    SLIME_BALL: { food: 3, saturation: 1 }

sculk:
  flicker-minutes: 20

bedrock:
  # hunger in icons (3 = 6 pts, 3.5 = 7, 4 = 8)
  hunger-threshold-drumsticks:
    1: 3.0
    2: 3.5
    3: 4.0
  steak-amount:
    1: 4
    2: 5
    3: 16
  steak-cooldown-minutes: 30
  # explosion on mobs (level 2)
  aoe-damage: 8.0
  aoe-radius: 10.0
  aoe-cooldown-minutes: 10
  # "final stand": a hit to 1 HP -> invulnerability (from level 2)
  laststand-hp: 1.0
  laststand-seconds: 5
  laststand-cooldown-minutes: 60
  max-air: 150
  # green particles when a Sculk player is nearby
  green-radius: 3.0
  green-count: 50

cat:
  water-damage-1: 3.0
  water-damage-2: 1.0
  levitation-seconds: 2
  creeper-fear-radius: 7
  fish-saturation-seconds-1: 5
  fish-saturation-seconds-2: 10

engineer:
  hunger-effect-seconds: 10
  web-speed-multiplier: 2.5

axe:
  # regeneration II on axe kill — level 1 only
  regen-chance: 5        # %
  regen-duration-seconds: 1
  rage-cooldown-minutes: 30
  head-chance: 2
  head-include-players: true
  teleport:
    max-distance: 20.0
    cooldown-seconds: 2
    hunger-cost-drumsticks: 4

spider:
  max-health-1: 18.0
  webs-needed: 9
  web-speed-multiplier: 7.0
  web-shot-cooldown-minutes:
    2: 10
    3: 5

amphibian:
  drowned-aggro-radius-1: 5.0
  sun-damage: 2.0
  nether-damage: 2.0

farmer:
  growth-radius: 10
  growth-chance-percent: 1
  weakness-hp: 5.0
  wolf-radius: 10.0

tasks:
  effects-interval-ticks: 40
  autosave-minutes: 5

# The soul world (/quirk lab create | /quirk lab tp | /quirk lab back)
labyrinth:
  world: void_labyrinth
                              # is loaded AS IS; generator/environment untouched
  prebuilt: false
                              # plugin treats it as ready for lab tp/back immediately
  # entrance:                 # entry point for a prebuilt world (default: first cell center)
  #   x: 0.5
  #   y: 65
  #   z: 0.5
  floor-y: 60
  cells: 57
  cell-size: 5
  wall-height: 10
  max-cages: 16
  soul-name: "&bTrapped Soul"
  wall-block: OBSIDIAN
  accent-block: CRYING_OBSIDIAN
  accent-chance: 12
  floor-block: OBSIDIAN
  ceiling-block: OBSIDIAN

zaycekrol:
  # Harebringers — a SEPARATE mob: vanilla rabbits are untouched; spawn via /quirk zayce only
  farmer-home-radius: 30
  farmer-cooldown-minutes: 5
  resident-home-radius: 15
  guard-radius: 14
  guard-scan: 6
  tsar-call-radius: 30
  cap-residents: 30
  cap-guards: 10
  cap-elite: 6

messages:
  no-permission: "%prefix%&cYou don't have permission."
  usage: "%prefix%&f/quirk set <player> <quirk> [level] &8| &f/quirk remove <player> &8| &f/quirk info [player] &8| &f/quirk list &8| &f/quirk reload"
  target-offline: "%prefix%&cPlayer not found or offline."
  invalid-quirk: "%prefix%&cUnknown quirk. Available: engineer, cat, bedrock, axe, sculk, farmer, amphibian, spider."
  invalid-level: "%prefix%&cLevel must be between 1 and 3."
  set-ok: "%prefix%&aPlayer &f%player% &agot the quirk &d%quirk% &a(lvl &d%level%&a)."
  removed: "%prefix%&aThe quirk of &f%player% &awas removed."
  reload-ok: "%prefix%&aConfig reloaded."
  you-got-quirk: "%prefix%&dThe shattered soul answered… something stirred within."
  you-lost-quirk: "%prefix%&7Your quirk has faded…"
  info-header: "&8&m--------&r &5%player%'s Quirks &8&m--------"
  info-line: "&fQuirk: &d%quirk% &7| &fLevel: &d%level%"
  info-notify: "&fNotifications: &d%state%"
  info-none: "%prefix%&7That player has no quirk."
  list-header: "&8&m-----&r &5Player Quirks &8&m-----"
  list-line: "&f%player% &8— &d%quirks%"
  list-empty: "%prefix%&7Nobody has a quirk."
  notify-on: "%prefix%&7Quirk notifications &aenabled&7."
  notify-off: "%prefix%&7Quirk notifications &cdisabled&7. Re-enable: /quirk notify"
  engineer-meat-denied: "&cAn elven stomach can't digest this!"
  axe-sword-craft-denied: "&cYour hands reject swords. Crafting denied."
  axe-sword-to-stick: "&eA sword in your inventory crumbled into a stick…"
  axe-no-meat: "&2You feel sick… your body accepts only meat."
  axe-hint-2: "&eShift+LMB &fwith an axe — rage"
  axe-hint-3: "&eShift+RMB &f— spatial rupture &8| &eShift+LMB &f— rage"
  axe-rage-on: "&4Rage fills you!"
  axe-rage-cooldown: "&cRage is cooling down: &f%time%&c."
  axe-teleport-cooldown: "&cDash is still cooling: &f%time% s."
  axe-teleport-fail: "&cNowhere to teleport."
  bedrock-steaks: "%prefix%&7The shattered soul answers: &f+%amount% steak(s)!"
  bedrock-aoe: "%prefix%&8A soul shockwave wounded nearby monsters!"
  bedrock-immortal: "%prefix%&8The soul flares into a core — you are invulnerable!"
  sculk-denied: "&2The flesh rejects this…"
  shard-given: "%prefix%&aSoul shard &d%quirk% &alvl &d%level% &agiven to &f%player%&a."
  shard-used: "%prefix%&dA soul shard flows into you… the soul answered."
  shard-weaker: "%prefix%&7Your soul already bears this quirk (or stronger). Shard kept."
  soul-freed: "&d✦ &b%player% &dfreed a soul from its cage! It left a shard…"
  pack-link: "%prefix%&bVoidSMP resource pack: &f%link%\n%prefix%&7Put it into server.properties as &fresource-pack=&7 and restart."
  lab-building: "%prefix%&5Building the soul labyrinth in world &f%world%&5… don't shut the server down."
  lab-created: "%prefix%&6Clean void world '%world%' created. Load your own labyrinth into it!"
  lab-exists: "%prefix%&eThe labyrinth already exists. Teleport: /quirk lab tp"
  lab-no-world: "%prefix%&cNo world yet. Run /quirk lab create first"
  zayce-spawned: "%prefix%&6Harebringer (%role%) summoned."
  zayce-colony: "%prefix%&6A harebringer colony settles right here."
  zayce-purged: "%prefix%&6Harebringers wiped: &f%count%"
  lab-command-off: "%prefix%&cWorld creation is disabled in this build."
  lab-prebuilt: "%prefix%&6Existing world accepted: nothing is built, the world is yours."
  lab-back: "&6Return complete. Welcome back up!"
  lab-tp: "%prefix%&dYou step into the soul labyrinth…"
  antidote-cured: "%prefix%&2The antidote burns your veins… the foreign power leaves your body!"
  antidote-none: "%prefix%&7Bitter. But there was nothing to expel."
  farmer-raw-denied: "&eRaw! That needs cooking."
  farmer-craft-denied: "&cYour hands can't master this recipe."
  spider-meat-denied: "&cYour body feeds on meat only!"
  spider-webs-hint: "&eShift + RMB with a sword &f— web shot &8(&7needs 9 cobwebs&8)"
  spider-webs-cooldown: "&cWeb glands are resting: &f%time%&c."
  spider-webs-none: "&cYou need at least 9 cobwebs in inventory!"
  spider-webs-cast: "&8*fwshh* &7Web launched!"
  amph-armor-denied: "&bNetherite drags you to the seabed — armor slips off!"

  # Titles (title = top line, subtitle = bottom line)
  title-engineer-redstone: "&cRedstone nearby: &f%count%"
  title-engineer-tnt: "&4TNT nearby: &c%count%"
  title-cat-water: "&bWater nearby: &f%count%"

  # v1.0 — magic
  magic-no-mage: "&7You haven't felt an element yet. Find an elemental book…"
  magic-bar: "%emoji% %element% &8| &bMana %mana%/%max% &8| &f%spell%"
  magic-learned: "&dThe element answered! %emoji% &f%element% &dis yours. &7RMB — cast, Q/F — cycle, Shift+F — menu."
  magic-already-element: "&7Your soul already listens to &f%element%&7. Switching requires a re-training potion."
  magic-need-four-books: "&cLight and dark only yield to those holding &f4 books&c of other elements."
  magic-book-weak: "&cThat book is too strong for you. Magic level %min%+ required."
  magic-level-up: "&b✦ Magic level: &f%level%&b!"
