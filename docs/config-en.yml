  magic-cast-dark5: "&5Your shadow copies duplicate your strikes!"
  magic-cast-light3: "&eAura of light burns nearby undead (30 s)."
  magic-cast-light4: "&eLight protects your mind (5 min)."
  magic-cast-light5: "&eLight shield: absorbs up to 20 damage (30 s)."
  # v1.0 — potions
  potion-quirk-away: "&8Something inside you dissolved into silence…"
  potion-nothing: "&7It passed through, finding nothing."
  potion-soul-stir: "&5Something vibrates from the depths… your soul answers."
  potion-samogon: "&6Moonshine lvl %level% &7— it burns, but you live."
  potion-deny: "&8Everything good was washed away."
  potion-confirm: "&fEverything bad was washed away."
  potion-life: "&cLife pulses inside you!"
  potion-limit: "&cYour body can't take another dose this soon."
  potion-watch: "&8The potion watches whether you'll hold out… (60 s)"
  potion-noharm-strike: "&4&lYou weakened — the harming potion struck back!"
