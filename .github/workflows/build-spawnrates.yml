name: Build VoidSpawnRates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build plugin
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon clean build 2>&1 | tee /tmp/build.log
      - name: Publish build errors as issue comment
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title VoidSpawnRates CI build log" --json number --jq '.[0].number')
          [ -z "$NUMBER" ] && exit 0
          ERRORS=$(grep -E "error:|warning:|What went wrong" -A 4 /tmp/build.log | head -c 55000)
          if [ -z "$ERRORS" ]; then
            ERRORS=$(tail -c 20000 /tmp/build.log)
          fi
          {
            echo "### \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA:0:8}\` — build failed"
            echo '```'
            echo "$ERRORS"
            echo '```'
          } > /tmp/report.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
      - name: Report JUnit results
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob
          import xml.etree.ElementTree as ET
          tests = failures = errors = 0
          for path in glob.glob("build/test-results/test/TEST-*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              for case in root.findall("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      text = (failure.get("message", "") + " " + (failure.text or ""))[:3500]
                      text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          print(f"::notice title=JUnit::Tests: {tests}; failures: {failures}; errors: {errors}")
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoidSpawnRates-tests
          path: build/test-results/test/*.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: VoidSpawnRates
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Fail on build error
        if: steps.build.outcome == 'failure'
        run: exit 1
