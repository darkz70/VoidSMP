name: Build VoidOferta

on:
  push:
    paths:
      - "VoidOferta/**"
      - ".github/workflows/build-voidoferta.yml"
  pull_request:
    paths:
      - "VoidOferta/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: VoidOferta
        run: gradle build --no-daemon 2>&1 | tee ../build.log

      - name: Report build failure as issue (debug)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 50000 build.log > build-tail.log
          gh issue create --title "VoidOferta build failed (run ${{ github.run_id }})" --body-file build-tail.log || true

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: VoidOferta-jar
          path: VoidOferta/build/libs/*.jar
          if-no-files-found: error
