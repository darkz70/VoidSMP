name: Build VoidOferta

on:
  push:
    paths:
      - "VoidOferta/**"
      - ".github/workflows/build-voidoferta.yml"
  pull_request:
    paths:
      - "VoidOferta/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: VoidOferta
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee ../build.log

      # В этом репозитории логи упавших сборок принято писать в issue #1
      - name: Report build failure to issue #1
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### VoidOferta: сборка упала, run ${{ github.run_id }}"
            echo '```'
            tail -c 45000 build.log
            echo '```'
          } > report.md
          gh issue comment 1 --body-file report.md || true

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: VoidOferta-jar
          path: VoidOferta/build/libs/*.jar
          if-no-files-found: error
