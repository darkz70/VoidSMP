name: Build VoidSMP

on:
  push:
    branches:
      - arena/e1e216ad-voidsmp
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee /tmp/build.log

      - name: Smoke test на Paper 26.2
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/mcserver/plugins"
          cd "$RUNNER_TEMP/mcserver"
          cp "$GITHUB_WORKSPACE"/build/libs/VoidSMP-*.jar plugins/

          echo "== Скачивание Paper 26.2 (fill v3 API) =="
          UA="VoidSMP-CI/1.0 (https://github.com/darkz70/VoidSMP)"
          OK=0
          URL=$(curl -fsSL -H "User-Agent: $UA" --max-time 30 \
            "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/latest" \
            | jq -r '."downloads"."server:default".url // empty' 2>/dev/null) || true
          if [ -z "$URL" ]; then
            LIST=$(curl -fsSL -H "User-Agent: $UA" --max-time 30 \
              "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds" 2>/dev/null) || true
            URL=$(printf '%s' "$LIST" | jq -r '
              (if type == "array" then . else (.builds // []) end)
              | (map(select(.channel == "STABLE")) | last // .[-1] // {})
              | ."downloads"."server:default".url // empty' 2>/dev/null) || true
          fi
          echo "resolved url: ${URL:-<пусто>}"
          if [ -n "$URL" ]; then
            curl -fsSL -H "User-Agent: $UA" --max-time 180 -o paper.jar "$URL" && OK=1
          fi
          if [ "$OK" != "1" ]; then
            {
              echo "=== Диагностика скачивания Paper 26.2 ==="
              echo "-- fill v3 builds/latest:"
              curl -sS -H "User-Agent: $UA" --max-time 30 -w "\nHTTP %{http_code}\n" \
                "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/latest" | head -c 2500 || true
              echo "-- fill v3 builds:"
              curl -sS -H "User-Agent: $UA" --max-time 30 -w "\nHTTP %{http_code}\n" \
                "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds" | head -c 1500 || true
            } | tee /tmp/paper-download-diag.txt
            echo "::error::Не удалось скачать Paper 26.2"
            exit 1
          fi
          ls -la paper.jar

          echo "== Запуск сервера =="
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft:flat\nview-distance=2\nsimulation-distance=2\nmotd=VoidSMP smoke\n' > server.properties
          mkfifo in.fifo
          java -Xms1G -Xmx1G -jar paper.jar --nogui < in.fifo > server.log 2>&1 &
          MC=$!
          exec 3>in.fifo

          STARTED=0
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log 2>/dev/null; then STARTED=1; break; fi
            if ! kill -0 "$MC" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$STARTED" != "1" ]; then
            echo "::error::Сервер не стартовал"
            tail -c 6000 server.log
            exit 1
          fi

          echo "/voidsmp status" >&3
          sleep 8
          echo "stop" >&3
          for i in $(seq 1 30); do
            kill -0 "$MC" 2>/dev/null || break
            sleep 2
          done
          kill -9 "$MC" 2>/dev/null || true
          exec 3>&- || true

          echo "== Проверки лога =="
          FAIL=0
          grep -q "LootTable=LOADED" server.log || { echo "::error::Лут-таблица не загрузилась (нет LootTable=LOADED)"; FAIL=1; }
          grep -q "NextReset=" server.log || { echo "::error::Команда /voidsmp status не отработала (нет NextReset=)"; FAIL=1; }
          if grep -E "Couldn't parse|Failed to parse|Exception loading|Error loading|There was an error" server.log; then
            echo "::error::Ошибки загрузки датапака/лут-таблицы"
            FAIL=1
          fi
          if grep -q "неизвестный предмет" server.log; then
            echo "::error::config.yml: есть неизвестные предметы (см. лог)"
            FAIL=1
          fi
          if grep "ERROR" server.log | grep -iE "voidsmp|loot|datapack|vault"; then
            echo "::error::ERROR в логе сервера про VoidSMP/лут"
            FAIL=1
          fi
          if [ "$FAIL" != "0" ]; then
            {
              echo "== Ключевые строки server.log (для отладки) =="
              grep -nE "voidsmp|VoidSMP|datapack|Datapack|data pack|Loot|loot|Couldn't parse|Failed to parse|Exception|ERROR" server.log \
                | grep -vE "Moonrise|ChunkHolder|Waiting 60s|Halted|Saving chunks|All dimensions" | head -150 || true
            } > /tmp/smoke-excerpt.txt
            tail -c 4000 server.log
            exit 1
          fi
          echo "Smoke test OK"

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --state open --search '"CI failure log" in:title' --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ]; then
            ISSUE=$(gh issue create --title "CI failure log" --body "Сюда CI пишет логи упавших сборок (автоматически)." | grep -oE '[0-9]+$')
          fi
          {
            echo "### VoidSMP: сборка/тест упала: run ${{ github.run_id }}, коммит ${{ github.sha }}"
            echo '```'
            tail -c 5500 /tmp/build.log 2>/dev/null | sed 's/```/`​``/g'
            echo '```'
            if [ -f /tmp/paper-download-diag.txt ]; then
              echo '```'
              cat /tmp/paper-download-diag.txt
              echo '```'
            fi
            if [ -f /tmp/smoke-excerpt.txt ]; then
              echo '```'
              cat /tmp/smoke-excerpt.txt
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/mcserver/server.log" ]; then
              echo '```'
              tail -c 3000 "$RUNNER_TEMP/mcserver/server.log" 2>/dev/null | sed 's/```/`​``/g'
              echo '```'
            fi
          } | gh issue comment "$ISSUE" --body-file -

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidSMP-jar
          path: build/libs/*.jar
          retention-days: 14

      - name: Update CI release
        if: github.ref == 'refs/heads/arena/e1e216ad-voidsmp'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete voidsmp-ci --cleanup-tag --yes 2>/dev/null || true
          gh release create voidsmp-ci build/libs/*.jar \
            --target "${{ github.sha }}" \
            --title "VoidSMP — автосборка" \
            --notes "Собрано из ветки ${{ github.ref_name }}, коммит ${{ github.sha }}. Положи jar в plugins сервера Paper 26.2." \
            --prerelease --latest=false

      - name: Commit jar в ветку (артефакт для репозитория)
        if: github.ref == 'refs/heads/arena/e1e216ad-voidsmp'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          cp build/libs/VoidSMP-*.jar dist/
          git add dist/
          if git diff --cached --quiet; then
            echo "Артефакт не изменился"
          else
            git commit -m "ci: артефакт VoidSMP jar"
          fi
          git pull --rebase origin arena/e1e216ad-voidsmp
          git push origin HEAD:arena/e1e216ad-voidsmp
