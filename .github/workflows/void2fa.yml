name: Void2FA checks
on:
  push:
    paths: ['Void2FA/**', '.github/workflows/void2fa.yml']
  pull_request:
    paths: ['Void2FA/**', '.github/workflows/void2fa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Void2FA/bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Void2FA
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'
      - name: Build and test plugin
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee build.log
      - name: Publish build diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          log = pathlib.Path('build.log')
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  if re.search(r'(?i)(error:|failed|exception|could not|what went wrong)', line):
                      print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:900])
          for path in pathlib.Path('build/test-results').glob('**/*.xml'):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for fail in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (fail.get('message') or fail.text or 'test failed')[:900]
                      print(f"::error file={path}::{case.get('classname')}.{case.get('name')}: " + msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: plugin-test-reports
          path: |
            Void2FA/build.log
            Void2FA/build/reports/
            Void2FA/build/test-results/
      - uses: actions/upload-artifact@v5
        with:
          name: Void2FA-plugin
          path: Void2FA/build/libs/Void2FA-1.3.3.jar
