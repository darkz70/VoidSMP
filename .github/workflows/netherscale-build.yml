name: Build NetherScale

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Paper plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress --errors clean package 2>&1 | tee maven-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            {
              echo '### Maven build failure details'
              echo '```text'
              tail -n 100 maven-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$build_status"

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: netherscale-${{ github.sha }}
          path: target/netherscale-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
