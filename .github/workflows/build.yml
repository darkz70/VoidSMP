name: Build plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: gradle --no-daemon clean build
      - name: Report JUnit results
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob
          import xml.etree.ElementTree as ET
          tests = failures = errors = 0
          for path in glob.glob("build/test-results/test/TEST-*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              for case in root.findall("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      text = (failure.get("message", "") + " " + (failure.text or ""))[:3500]
                      text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          print(f"::notice title=JUnit::Tests: {tests}; failures: {failures}; errors: {errors}")
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results
          path: build/test-results/test/*.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: VoidFastBoats
          path: build/libs/*.jar
          if-no-files-found: error
