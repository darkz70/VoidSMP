# Self-hosted alternative to Bothost. Publish the sync API only behind HTTPS/reverse proxy.
services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN_FILE: /run/secrets/bot_token
      BRIDGE_SHARED_SECRET_FILE: /run/secrets/bridge_secret
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 8080
    secrets: [bot_token, bridge_secret]
    volumes: [bot-state:/data]
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
secrets:
  bot_token:
    file: ./secrets/bot_token
  bridge_secret:
    file: ./secrets/bridge_secret
volumes:
  bot-state:
