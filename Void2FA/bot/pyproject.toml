[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voidsmp-telegram-bot"
version = "1.2.0"
description = "External Telegram transport for Void2FA"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.14.5,<4"]

[project.optional-dependencies]
test = ["pytest>=9.2,<10", "pytest-asyncio>=1.4,<2"]

[project.scripts]
voidsmp-bot = "voidsmp_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["voidsmp_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
