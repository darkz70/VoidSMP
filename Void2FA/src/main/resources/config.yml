# ============================================================
#  Void2FA — двухфакторная аутентификация (2FA) через Telegram
#  Плагин для Paper 26.2 · автор: darkz70
# ============================================================
#  КАК ЗАПУСТИТЬ:
#   1. Создай бота у @BotFather в Telegram (команда /newbot).
#   2. Скопируй токен бота в поле bot-token ниже.
#   3. Выполни /2faadmin reload в игре (или перезапусти сервер).
#   4. Привяжи аккаунт: /2fa link  ->  отправь боту /link <код>.
#   5. Готово! При следующем входе бот пришлёт код и кнопки.
#  Пока bot-token пустой, плагин НИКОГО не блокирует.
# ============================================================

telegram:
  # embedded — Telegram-клиент внутри плагина (как в версии 1.0.0).
  # external — отдельный бот из каталога bot/; плагин НЕ вызывает Telegram API.
  transport: embedded

  # Только для embedded. В external оставь пустым. Не публикуй этот файл с токеном.
  bot-token: ""
  # Необязательная проверка username. В external заполняется ботом после getMe.
  bot-username: ""

  # Используется только в external. Бот хостится отдельно (например, на bothost.ru),
  # а плагин сам ходит к нему по HTTPS. Входящий порт на Minecraft-сервере не нужен.
  bridge:
    # HTTPS-домен бота из панели Bothost, например https://bot-123-user.bothost.tech
    # Без пути, query и логина/пароля. Для локальных тестов допустим http://127.0.0.1:8080.
    url: "https://bot-1793902194-2443-verte82.bothost.tech"
    # Секрет: переменная VOID2FA_BRIDGE_SECRET (приоритет) или этот локальный файл.
    # Формат: 64 hex-символа либо base64 от 32 случайных байт. Не храните в Git.
    secret-file: "bridge-secret.txt"

    # Сколько секунд ждать ответ бота. Bothost на дешёвом тарифе отвечает не мгновенно,
    # поэтому 30, а не 20. Диапазон 5..120.
    timeout-seconds: 30
    # Отдельный лимит на установку TCP/TLS-соединения. Диапазон 3..60.
    connect-timeout-seconds: 10
    # Сколько секунд последний успешный обмен считается «связь есть».
    # 0 = автоматически (timeout-seconds + 10). Раньше тут было жёстко 15 с, из-за чего
    # медленный, но рабочий бот постоянно выглядел недоступным и 2FA не срабатывала.
    # Не ставь меньше timeout-seconds. Диапазон 0..600.
    ready-grace-seconds: 0

settings:
  # opt-in   — 2FA только у тех, кто привязал Telegram и включил её.
  # required — 2FA обязательна для всех (кроме права void2fa.bypass).
  mode: opt-in

  # Длина одноразового кода подтверждения.
  code-length: 6
  # Сколько секунд действует код подтверждения.
  code-ttl-seconds: 120
  # Сколько секунд даётся на подтверждение входа (потом кик).
  auth-timeout-seconds: 90
  # Максимум неверных попыток ввода кода (потом кик).
  max-attempts: 5
  # Не спрашивать 2FA повторно при входе с того же IP в течение N минут.
  # 0 = спрашивать при каждом входе.
  session-minutes: 0

  # Замораживать игрока до подтверждения (движение, чат, команды, урон и т.д.).
  freeze: true
  # Накладывать слепоту, пока вход не подтверждён.
  blindness: true

  # Если бот не настроен или недоступен:
  #   false — пускать всех (безопасно на этапе настройки, рекомендуется);
  #   true  — не пускать никого без права void2fa.bypass.
  lockdown-if-unavailable: false

  # Доверенные устройства. Minecraft-сервер видит только IP клиента, поэтому
  # "устройство" = доверенный IP. После успешного подтверждения входа этот IP
  # запоминается, и следующие входы с него проходят без кода. Другие IP требуют 2FA.
  trusted-devices:
    enabled: true
    # Запоминать устройство автоматически при нажатии "Подтвердить" / вводе кода.
    remember-on-approve: true
    # Сколько устройств хранить на игрока. Старое неиспользуемое вытесняется.
    max-devices: 5
    # Срок действия доверенного устройства в днях. 0 = бессрочно.
    ttl-days: 0

  # Блокировка аккаунта: /2fa lock или /lock в Telegram.
  # Пока аккаунт заблокирован, войти нельзя никому (даже с доверенного устройства
  # и с правом void2fa.bypass). Разблокировка: /unlock в Telegram или /2faadmin unlock.
  account-lock:
    enabled: true

