  tg-link-invalid: "❌ Неверный или просроченный код привязки. В игре: /2fa link"
  tg-start: "Привет! Я бот двухфакторной аутентификации VoidSMP.\n\nПривяжи аккаунт в игре командой /2fa link и отправь мне полученный код.\n\nКоманды:\n/link <код> — привязать аккаунт\n/status — статус привязки\n/unlink — отвязать аккаунт\n/help — помощь"
  tg-help: "Команды:\n/link <код> — привязать аккаунт (код из игры: /2fa link)\n/status — статус привязки\n/unlink — отвязать аккаунт"
