  attempts-kick: "&cСлишком много неверных попыток."
  lockdown-kick: "&c2FA временно недоступна. Попробуй позже."

  # --- Админ ---
  admin-reloaded: "&aКонфигурация Void2FA перезагружена."
  admin-reset: "&a2FA сброшена для игрока &b{player}&a."
  admin-enabled: "&a2FA включена для &b{player}&a."
  admin-disabled: "&e2FA выключена для &b{player}&e."
  admin-not-linked: "&cУ игрока &b{player}&c не привязан Telegram."
  admin-status: "&7Игрок &b{player}&7: 2FA={state}, Telegram={link}"
