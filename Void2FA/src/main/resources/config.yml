  tg-status-unlinked: "Аккаунт не привязан. В игре выполни /2fa link"
  tg-unlink-success: "✅ Telegram отвязан."
  tg-unlink-none: "Нечего отвязывать — аккаунт не привязан."
  tg-unlink-pending: "⚠️ Нельзя отвязать аккаунт во время входа. Сначала подтверди или отклони вход."
  tg-unknown: "Не понимаю 🤔 Используй /help"

  # --- Кнопки ---
  button-approve: "✅ Подтвердить"
