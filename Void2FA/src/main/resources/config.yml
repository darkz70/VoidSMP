# ============================================================
#  Void2FA — двухфакторная аутентификация (2FA) через Telegram
#  Плагин для Paper 26.2 · автор: darkz70
# ============================================================
#  КАК ЗАПУСТИТЬ:
#   1. Создай бота у @BotFather в Telegram (команда /newbot).
#   2. Скопируй токен бота в поле bot-token ниже.
#   3. Выполни /2faadmin reload в игре (или перезапусти сервер).
#   4. Привяжи аккаунт: /2fa link  ->  отправь боту /link <код>.
#   5. Готово! При следующем входе бот пришлёт код и кнопки.
#  Пока bot-token пустой, плагин НИКОГО не блокирует.
# ============================================================

telegram:
  # embedded — Telegram-клиент внутри плагина (как в версии 1.0.0).
  # external — отдельный бот из каталога bot/; плагин НЕ вызывает Telegram API.
  transport: embedded

  # Только для embedded. В external оставь пустым. Не публикуй этот файл с токеном.
  bot-token: ""
  # Необязательная проверка username. В external заполняется ботом после getMe.
  bot-username: ""

  # Используется только в external. По умолчанию доступен лишь с этой машины.
  # Для другой машины используй HTTPS reverse proxy или SSH-туннель.
  bridge:
    host: "127.0.0.1"
    port: 8765
    # Секрет: переменная VOID2FA_BRIDGE_SECRET (приоритет) или этот локальный файл.
    # Формат: 64 hex-символа либо base64 от 32 случайных байт. Не храните в Git.
    secret-file: "bridge-secret.txt"

settings:
  # opt-in   — 2FA только у тех, кто привязал Telegram и включил её.
  # required — 2FA обязательна для всех (кроме права void2fa.bypass).
  mode: opt-in

  # Длина одноразового кода подтверждения.
  code-length: 6
  # Сколько секунд действует код подтверждения.
  code-ttl-seconds: 120
  # Сколько секунд даётся на подтверждение входа (потом кик).
  auth-timeout-seconds: 90
  # Максимум неверных попыток ввода кода (потом кик).
  max-attempts: 5
  # Не спрашивать 2FA повторно при входе с того же IP в течение N минут.
  # 0 = спрашивать при каждом входе.
  session-minutes: 0

  # Замораживать игрока до подтверждения (движение, чат, команды, урон и т.д.).
  freeze: true
  # Накладывать слепоту, пока вход не подтверждён.
  blindness: true

  # Если бот не настроен или недоступен:
  #   false — пускать всех (безопасно на этапе настройки, рекомендуется);
  #   true  — не пускать никого без права void2fa.bypass.
  lockdown-if-unavailable: false

# ------------------------------------------------------------
#  Сообщения. Цвета через '&'. Плейсхолдеры: {player} {code} {ip}
#  {attempts} {token} {bot} {url} {minutes} {state} {seconds}
# ------------------------------------------------------------
messages:
  prefix: "&8[&bVoid2FA&8]&r "

  # --- Игроку в игре ---
  auth-required: "&7Требуется подтверждение входа. Код отправлен в Telegram. Введи &b/login <код>&7 или нажми кнопку в боте."
  link-required: "&7Для входа привяжи Telegram: &b/2fa link"
  code-sent: "&7Код отправлен в твой Telegram. Введи &b/login <код>&7 или нажми &a✅&7 в боте."
  reminder: "&7⏳ Подтверди вход в Telegram или введи &b/login <код>&7."
  approved: "&a✅ Вход подтверждён. Добро пожаловать!"
  wrong-code: "&cНеверный код. Осталось попыток: &e{attempts}&c."
  no-pending: "&7Сейчас нет активного запроса на вход."
  code-expired: "&cКод истёк. Запроси новый: &b/2fa resend"
  too-many-attempts: "&cСлишком много неверных попыток."
  not-linked: "&cТы ещё не привязал Telegram. Используй &b/2fa link"
  already-linked: "&cTelegram уже привязан. Сначала &b/2fa unlink"
  link-start: "&7🔗 Привязка Telegram:\n&71. Открой бота &b{bot}\n&72. Отправь ему: &b/link {token}\n&7Или перейди по ссылке: &b{url}\n&7Код действует {minutes} мин."
  link-success: "&a✅ Telegram привязан! 2FA включена."
  unlink-success: "&aTelegram отвязан. 2FA выключена."
  enabled: "&a2FA включена."
  disabled: "&e2FA выключена."
  must-be-authenticated: "&cСначала подтверди вход."
  bot-not-configured: "&eБот ещё не настроен. 2FA пока не работает."
  no-permission: "&cУ тебя нет прав."
  player-only: "&cЭта команда только для игроков."
  usage-login: "&7Использование: &b/login <код>"
  unknown-subcommand: "&cНеизвестная подкоманда. &7/2fa help"
  status-self: "&7Статус 2FA: {state}\n&7Telegram: {link}"
  help-player: "&bVoid2FA &7— команды:\n&b/2fa link &7— привязать Telegram\n&b/2fa unlink &7— отвязать Telegram\n&b/2fa on &7/ &boff &7— вкл/выкл 2FA\n&b/2fa code <код> &7— подтвердить вход\n&b/2fa resend &7— выслать код повторно\n&b/login <код> &7— быстрый ввод кода"

  # --- Кик ---
  timeout-kick: "&cВремя подтверждения входа истекло.\n&7Зайди снова и подтверди вход в Telegram."
