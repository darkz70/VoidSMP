  help-admin: "&bVoid2FA Admin &7— команды:\n&b/2faadmin reload &7— перезагрузить конфиг\n&b/2faadmin status <игрок> &7— статус\n&b/2faadmin reset <игрок> &7— сбросить привязку\n&b/2faadmin enable <игрок> &7— включить 2FA\n&b/2faadmin disable <игрок> &7— выключить 2FA"

