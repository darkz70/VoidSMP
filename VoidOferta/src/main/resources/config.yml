# VoidOferta — публичная оферта VDS Corp для VOID SMP
# Текст самой оферты лежит рядом: plugins/VoidOferta/oferta.txt
# После правок: /oferta reload

# Через сколько тиков после входа открывать книгу (20 тиков = 1 секунда)
open-delay-ticks: 20

# Пока игрок не подтвердил оферту: запрещать движение, взаимодействие
# с миром и использование команд (кроме /oferta). Книгу можно открыть
# повторно в любой момент командой /oferta
freeze-until-accepted: true

# Заголовок и автор книги (отображаются при наведении на книгу)
book-title: "Публичная оферта № VDS-VOID-01"
book-author: "VDS Corp"

# Сколько символов помещать на одну страницу книги.
# Не поднимайте выше ~250: страница книги физически не вмещает больше.
page-size: 210

# --- Интеграция с плагином авторизации (SimpleLogin) ---
# Если на сервере стоит SimpleLogin, оферта показывается ПОСЛЕ ввода
# пароля, а не сразу при входе. До авторизации плагин игрока вообще
# не трогает: не открывает книгу и не блокирует команды (иначе его
# собственный запрет команд не дал бы ввести /login).
auth:
  # Включить интеграцию (если плагина авторизации на сервере нет —
  # оферта просто показывается при входе, как раньше)
  enabled: true
  # Имя плагина авторизации (как в /plugins)
  plugin-name: "SimpleLogin"
  # Команды, после которых считается, что игрок ввёл пароль
  login-commands:
    - login
    - register
    - reg
  # Сколько тиков после входа игнорировать движение при определении
  # «игрок авторизовался» (чтобы телепорт SimpleLogin на спавн
  # не засчитался за успешный вход). 40 тиков = 2 секунды
  move-grace-ticks: 40
