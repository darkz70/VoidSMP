name: VoidSpawnRates
version: '${version}'
main: ru.voidsmp.spawnrates.VoidSpawnRatesPlugin
api-version: '26.2'
description: Зоны скорости спавна мобов с постоянным хранением (SQLite)
author: darkz70
website: https://github.com/darkz70/VoidSMP
commands:
  spawnrate:
    description: Создание и настройка зон спавна мобов
    usage: /spawnrate help
    aliases: [zsr, mobrate]
    # Гейт на уровне Bukkit: без voidspawnrates.view команда не выполняется и не
    # попадает в автодополнение. Voidspawnrates.view по умолчанию выдан операторам,
    # поэтому для игроков команды нет ни в Tab, ни в чате.
    permission: voidspawnrates.view
    permission-message: Недостаточно прав: команды VoidSpawnRates доступны только операторам.
permissions:
  voidspawnrates.admin:
    description: Создание/удаление/изменение зон
    default: op
    # право на изменение зон автоматически даёт право их смотреть и к ним телепортироваться
    children:
      voidspawnrates.view: true
      voidspawnrates.teleport: true
  voidspawnrates.view:
    description: Просмотр списка зон и статистики
    default: op
  voidspawnrates.teleport:
    description: Телепорт к зоне
    default: op
