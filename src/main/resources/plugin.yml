name: VoidQuirks
version: ${version}
main: me.darkz70.quirks.VoidQuirksPlugin
api-version: '26.2'
authors: [darkz70, ArenaAgent]
description: Причуды расколотых душ VoidSMP — способности и дебаффы (3 уровня).
website: https://github.com/darkz70/VoidSMP
commands:
  quirk:
    description: Управление причудами душ
    aliases: [quirks, причуда]
    usage: /quirk <set|remove|info|list|reload>
    permission: quirks.user
  magic:
    description: Магия VoidSMP — меню заклинаний и админ-выдача
    aliases: [магия]
    usage: /magic [book|upbook|brew|set]
    permission: quirks.user
  gaid:
    description: Книга-гайд по механикам VoidSMP (админ)
    usage: /gaid [phrase <текст>|nick <игрок> <ник|reset>|lore <on|off>|relic <id> [игрок]]
  mage:
    description: Причуда «Маг» — меню прямого выбора стихии магии
    aliases: [маг]
    usage: /mage
    permission: quirks.user
  ivent:
    description: Ивент «Недрочабрь» — световые мечи (админ)
    usage: /ivent <open|give|reset|status>
    # permission намеренно НЕ объявлена здесь: Bukkit блокировал бы команду ДО того,
    # как наш код в IventCommand#onCommand успеет пропустить настоящих OP через
    # Perms.isAdmin() (isOp() || hasPermission) — это и была причина бага
    # «Недостаточно прав.» для админов на /gaid и /ivent.
  zayk:
    description: Политика зайцекролов для игроков — партии, цари, выборы
    aliases: [зайцекрол]
    usage: /zayk
    permission: quirks.user
  voidticker:
    permission: quirks.user
    description: Резонансный тикер пустоты
    usage: /voidticker
  soulweather:
    permission: quirks.user
    description: Погода душ по архиву
    usage: /soulweather
  effigylog:
    permission: quirks.user
    description: Журнал кукольных трекеров
    usage: /effigylog
  hermitgram:
    permission: quirks.user
    description: Примитивный граммофон анахорета
    usage: /hermitgram
  stardustindex:
    permission: quirks.user
    description: Индекс звёздной пыли (прогноз)
    usage: /stardustindex
permissions:
  quirks.admin:
    description: Полное управление причудами
    default: op
  quirks.user:
    description: Базовые команды VoidSMP (видны всем игрокам)
    default: true
