# ==========================================================================
#  VoidSpawnRates — зоны скорости спавна мобов
#  Все зоны хранятся в SQLite (plugins/VoidSpawnRates/data.db) и поэтому
#  переживают рестарты, /reload и перезагрузку чанков.
# ==========================================================================

# Общий переключатель плагина. false = события спавна не обрабатываются вовсе.
enabled: true

storage:
  # AUTO — SQLite, а если драйвер недоступен или файл повреждён, YAML (zones.yml).
  # SQLITE — только SQLite (падение = ошибка в логе и отключение обработки спавна).
  # YAML — плоский файл zones.yml (для отладки / переноса руками).
  type: AUTO
  file: data.db
  yaml-file: zones.yml
  # Периодика принудительной синхронизации записи с диском (WAL checkpoint), секунд.
  # Изменения пишутся сразу; это — страховка для долгих сессий.
  checkpoint-seconds: 300

limits:
  # Максимальный множитель в одной зоне (1.0 = как ванилла, 0.0 = спавна нет).
  max-multiplier: 10.0  # Максимальный размер зоны по любой из осей, в блоках. Бережёт индекс чанков.
  max-zone-size: 256
  # Сколько всего зон можно держать на сервере.
  max-zones: 200
  # Сколько мобов максимум снимается за один проход лимита (защита от лаг-спайка).
  max-removal-per-tick: 32

selection:
  # Предмет-«палка» для выделения кубоида: ЛКМ — точка 1, ПКМ — точка 2.
  # Обычный предмет этого типа не сработает — палка помечается PersistentData.
  wand: WOODEN_AXE

spawn:
  # Как комбинировать настройки пересекающихся зон:
  # PRIORITY  — действует зона с наибольшим priority (остальные игнорируются)
  # MULTIPLY  — множители перемножаются
  # STRICTEST — берётся наименьший множитель
  overlap: PRIORITY

  # Причины спавна, на которые влияют зоны. Правильно трогать только «цикл
  # спавна» ваниллы; всё остальное (яйца, /summon, разведение, постройки)
  # остаётся нетронутым, иначе админ сам себе запретит спаунить мобов.
  reasons:
    - NATURAL
    - JOCKEY
    - PATROL
    - RAID
    - VILLAGE_INVASION
  # Причины спавна из спавнеров. Учитываются только для зон с spawners: true.
  spawner-reasons:
    - SPAWNER
    - TRIAL_SPAWNER
    - OMINOUS_ITEM_SPAWNER

  # Множитель > 1 реализуется доп. спауном тех же мобов рядом (отменять спавн,
  # чтобы сделать его чаще, невозможно). Отключите, если лишние сущности не нужны.
  extra-spawns: true
  max-extra-spawns: 3

  # Запрещать спавн, когда в зоне уже набран её лимит мобов (cap).
  deny-at-cap: true
  # При жёстком запрете (множитель 0) просить ваниллу не пробовать другие точки
  # в этом чанке — заметно дешевле, чем отменять каждый спавн по отдельности.
  abort-spawn-attempts: true

cap:
  # Как часто пересчитывать количество мобов в зонах с cap (в тиках).
  check-interval-ticks: 40
  # Не считать и не удалять мобы в зонах, где рядом нет игроков — большая экономия.
  skip-when-no-players-nearby: true
  # На каком расстоянии от границы зоны должен быть игрок, чтобы зону считать.
  player-distance: 128
  # По умолчанию для новых зон: удалять лишних мобов при превышении cap.
  remove-excess-default: false
  # Не удалять именованных (name tag) мобов — обычно это NPC и питомцы.
  protect-named-mobs: true
  # Не удалять мобов, на которых кто-то едет.
  protect-riders: true

preview:
  # Частицы для показа границ зоны (без данных; END_ROD, FLAME, SOUL, SMOKE...).
  particle: END_ROD
  # Точек на одно ребро рамки (дальше автоматически режется под размер зоны).
  points-per-edge: 16
  # Как далеко от игрока рисовать рамку, в блоках.
  distance: 96
  # Период обновления рамки/подписи, в тиках.
  interval-ticks: 20
  # Показывать игроку в action bar зону, внутри которой он стоит.
  hud: true

debug: false
