# Ускорение обычных лодок, плотов и вариантов с сундуком.
enabled: true
# 1 = без вмешательства плагина; 2 = ускоренный режим. Диапазон 1–20.
# Это коэффициент целевой скорости, не гарантия точного удвоения.
multiplier: 2.0
# Целевой предел горизонтальной скорости при разгоне, блоков/тик.
# 1.2 = 24 блока/сек при 20 TPS. Диапазон 0.1–8.0.
# Команда /boatspeed <число> автоматически заменяет этот лимит на 0.4 × число.
max-speed: 1.2
# Пустой список = все миры. Иначе точные имена миров, где включено ускорение.
worlds: []
