# Ускорение обычных лодок, плотов и вариантов с сундуком.
enabled: true
# Любое конечное число >= 1, верхнего предела множителя нет.
# 1 = без вмешательства; число задаёт целевую скорость 0.4 × множитель.
# Достижение выбранной скорости и плавность зависят от клиента и сервера.
multiplier: 2.0
# Старый max-speed больше не используется.
# Пустой список = все миры. Иначе точные имена разрешённых миров.
worlds: []
