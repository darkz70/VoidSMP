# Ускорение обычных лодок, плотов и вариантов с сундуком.
enabled: true
# 1 = без вмешательства плагина; 2 = ускоренный режим. Диапазон 1–5.
# Это коэффициент тяги и целевой скорости, не гарантия точного удвоения.
multiplier: 2.0
# Абсолютный потолок горизонтальной скорости при ускорении, блоков/тик.
# 1.2 = 24 блока/сек при 20 TPS. Диапазон 0.1–2.0.
max-speed: 1.2
# Пустой список = все миры. Иначе точные имена миров, где включено ускорение.
worlds: []
