  axe-hint-2: "&eShift + &fCtrl &e— режим ярости"
  axe-hint-3: "&eShift+ПКМ &f— разрыв пространства &8| &eShift+Ctrl &f— ярость"
  axe-rage-on: "&4Ярость переполняет тебя!"
  axe-rage-cooldown: "&cЯрость остывает: &f%time%&c."
  axe-teleport-cooldown: "&cРывок ещё остывает: &f%time% с."
  axe-teleport-fail: "&cНекуда телепортироваться."
  bedrock-steaks: "%prefix%&7Расколотая душа отзывается: &f+%amount% стейка(-ов)!"
  bedrock-aoe: "%prefix%&8Ударная волна души ранила монстров поблизости!"
  bedrock-immortal: "%prefix%&8Ядро бедрока вспыхивает — ты неуязвим!"
  sculk-denied: "&2Плоть отторгает это…"
  shard-given: "%prefix%&aОсколок души &d%quirk% &aур. &d%level% &aвыдан игроку &f%player%&a."
  shard-used: "%prefix%&dОсколок души вливается в тебя… Причуда: &f%quirk% &dур. &f%level%&d."
  shard-weaker: "%prefix%&7Твоя душа уже носит эту причуду (или сильнее). Осколок сохранён."
